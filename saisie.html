<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire POST</title>
</head>
<body>
    <h2>Saisie des notes</h2>

    <form action="traitement.php" method="POST">
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required><br><br>

        <label for="note_info">Note Informatique (0-20) :</label>
        <input type="number" step="0.25" id="note_info" name="note_info" required><br><br>

        <label for="note_math">Note Mathématiques (0-20) :</label>
        <input type="number" step="0.25" id="note_math" name="note_math" required><br><br>

        <input type="submit" value="Valider">
    </form>
</body>
</html>
